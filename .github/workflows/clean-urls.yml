name: Clean Webflow URLs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      sync_en:
        description: 'Re-sync English pages from Webflow staging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  clean-urls:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync English pages if requested
        if: "${{ github.event.inputs.sync_en == 'true' }}"
        run: python3 scripts/sync_en.py

      - name: Run Clean URLs Script
        run: python3 scripts/clean_urls.py

      - name: Commit and push changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-clean Webflow .html URLs [skip ci]"
            git push
          else
            echo "No changes needed. All URLs are already clean."
          fi
