  <script>
  window.Webflow ||= [];
  window.Webflow.push(() => {
    const navbar = document.querySelector('.navbar');
    const kontaktButton = navbar.querySelector('.kontakt-button');
    const sections = [...document.querySelectorAll('[data-theme]')];
    function updateNavbarTheme() {
      // Only run the theme change for tablet and above
      if (window.innerWidth < 768) {
        navbar.classList.remove('light-theme', 'dark-theme');
        return;
      }
      const navHeight = navbar.offsetHeight;
      const fromTop = window.scrollY + navHeight + 1;
      let activeTheme = 'light'; // default
      for (const section of sections) {
        const rect = section.getBoundingClientRect();
        const top = rect.top + window.scrollY;
        const bottom = top + section.offsetHeight;
        if (fromTop >= top && fromTop <= bottom) {
          activeTheme = section.getAttribute('data-theme');
          break;
        }
      }
      // Apply theme classes
      if (activeTheme === 'light') {
        navbar.classList.remove('light-theme');
        navbar.classList.add('dark-theme');
      } else {
        navbar.classList.remove('dark-theme');
        navbar.classList.add('light-theme');
      }
      // Keep kontakt button white regardless of theme
      if (kontaktButton) {
        kontaktButton.style.color = 'white';
      }
    }
    window.addEventListener('scroll', updateNavbarTheme);
    window.addEventListener('load', updateNavbarTheme);
    window.addEventListener('resize', updateNavbarTheme);
    // Also trigger right away after Webflow is ready
    updateNavbarTheme();
  });
</script>
